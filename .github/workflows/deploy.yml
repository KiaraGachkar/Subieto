name: Deploy Subieto to cPanel (SSH/SFTP Port 22)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, zip, iconv
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install sshpass & rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy public/ and app core via SSH (Port 22)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          SSH_OPTS="ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # Ensure target directories exist
          sshpass -e $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p ~/public_html ~/subieto"

          # 1. Deploy public/ to ~/public_html/
          sshpass -e rsync -az -e "$SSH_OPTS" \
            --exclude='.git*' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            ./public/ "$SSH_USER@$SSH_HOST:~/public_html/"

          # 2. Deploy app core to ~/subieto/ (keeps live DB config & storage intact)
          sshpass -e rsync -az -e "$SSH_OPTS" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='public/' \
            --exclude='config/database.php' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            ./ "$SSH_USER@$SSH_HOST:~/subieto/"