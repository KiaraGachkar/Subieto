name: Deploy to cPanel (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # ↓↓↓ این سه مورد را مستقیم همین‌جا ویرایش کنید ↓↓↓
  SSH_HOST: "YOUR_SERVER_IP_OR_DOMAIN"      # مثلا 185.10.20.30
  SSH_USER: "YOUR_CPANEL_USERNAME"          # نام کاربری cPanel
  REMOTE_DIR: "~/subieto/"                  # مسیر پروژه روی سرور
  SSH_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, json, mbstring
          tools: composer:v2

      - name: Install dependencies (production)
        run: composer install --no-dev -o --no-interaction --prefer-dist

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload with rsync
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}   # رمز cPanel (همان Secret که قبلا ساختید)
        run: |
          rsync -az --human-readable --stats \
            -e "sshpass -e ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='composer.lock' \
            --exclude='config/database.php' \
            --exclude='storage/' \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}"
