name: Deploy to cPanel (Split Public & Private Core)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CORE_DIR: "subieto"       # هسته خصوصی پروژه بیرون از وب‌روت (~/subieto)
  WEB_DIR: "public_html"    # پوشه عمومی دامنه (~/public_html)
  SFTP_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, json, mbstring
          tools: composer:v2

      - name: Install dependencies (production)
        run: composer install --no-dev -o --no-interaction --prefer-dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload Core & Public via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://${FTP_SERVER}:${SFTP_PORT}" -e "
            set sftp:auto-confirm yes;
            set ftp:list-options -a;
            set net:max-retries 2;
            set net:timeout 20;

            # 1. آپلود هسته خصوصی پروژه در ~/subieto (بیرون از public_html)
            mirror -R --verbose --parallel=4 \
              -x '^\.git' \
              -x '^\.github' \
              -x '^public/' \
              -x '^storage/' \
              -x '^config/database\.php$' \
              -x '^README\.md$' \
              -x '^composer\.lock$' \
              ./ ${CORE_DIR}/;

            # اطمینان از وجود پوشه‌های مورد نیاز در ~/subieto
            mkdir -p ${CORE_DIR}/config;
            mkdir -p ${CORE_DIR}/storage/cache;
            mkdir -p ${CORE_DIR}/storage/pages;
            mkdir -p ${CORE_DIR}/storage/logs;

            # 2. آپلود فقط محتوای public/ (شامل index.php, .htaccess, assets) در ~/public_html
            mirror -R --verbose --parallel=4 \
              ./public/ ${WEB_DIR}/;

            quit"
