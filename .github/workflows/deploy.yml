name: Deploy to cPanel (SFTP port 22)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REMOTE_DIR: "subieto"   # پوشه‌ی پروژه روی سرور (نسبت به home اکانت)
  SFTP_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, json, mbstring
          tools: composer:v2

      - name: Install dependencies (production)
        run: composer install --no-dev -o --no-interaction --prefer-dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://${FTP_SERVER}:${SFTP_PORT}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            mirror -R --verbose --parallel=4 \
              -x '^\.git' \
              -x '^storage/' \
              -x '^config/database\.php$' \
              -x '^README\.md$' \
              -x '^composer\.lock$' \
              ./ ${REMOTE_DIR}/;
            quit"
