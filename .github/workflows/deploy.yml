name: Deploy to cPanel (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # مسیر پروژه روی سرور (نسبت به home اکانت cPanel) — در صورت نیاز عوض کنید
  REMOTE_DIR: "~/subieto/"
  SSH_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, json, mbstring
          tools: composer:v2

      - name: Install dependencies (production)
        run: composer install --no-dev -o --no-interaction --prefer-dist

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Upload with rsync
        run: |
          rsync -az --human-readable --stats \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='composer.lock' \
            --exclude='config/database.php' \
            --exclude='storage/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_DIR}"
