name: Deploy Subieto to cPanel (Pure SFTP Port 22)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, zip, iconv
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via Pure SFTP (Port 22)
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<'EOF'
          set sftp:auto-confirm yes
          set net:timeout 25
          set net:max-retries 3
          set xfer:clobber yes

          mkdir -pf public_html
          mkdir -pf subieto

          # 1. Deploy public/ to public_html/
          mirror -R --parallel=4 \
            --exclude-glob .git* \
            --exclude ^\.well-known/ \
            --exclude ^cgi-bin/ \
            ./public/ public_html/

          # 2. Deploy app core to subieto/ (keeps live DB config & storage intact)
          mirror -R --parallel=4 \
            --exclude-glob .git* \
            --exclude ^\.github/ \
            --exclude ^public/ \
            --exclude ^config/database\.php$ \
            --exclude ^storage/ \
            --exclude ^node_modules/ \
            ./ subieto/

          bye
          EOF